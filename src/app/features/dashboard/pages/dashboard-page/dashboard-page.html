<div class="max-w-5xl">
  <h1 class="text-2xl font-semibold mb-3">Dashboard</h1>
  <p class="text-gray-600 dark:text-gray-300">Welcome back 👋</p>

  <div class="mt-6 grid grid-cols-1 gap-4">
    @if (upcomingWidget()) {
      <ng-container *ngComponentOutlet="upcomingWidget()!" />
    } @else {
      <div class="animate-pulse h-48 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800"></div>
    }
  </div>
</div>
